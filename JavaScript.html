<script>
    let currentZoom = 1.0;
    let editingSlotIndex = null;
    let draggedSlotIndex = null;
    let isDraggingActive = false;
    let isFontSettingsOpen = false;
    let draggedRowIndex = null;
    let actualPreviewScale = 1.0;

    let slotsData = Array(36).fill(null);
    let stockItems = [];
    let labelStockItems = []; // ★ 一時保管ラベル用の配列
    let singleMasterItems = [];
    let setMasterPresets = [];
    let savedDraftList = [];
    let synonymMasterGroups = [
      ['鶏', '鳥', 'とり', 'トリ', 'チキン'],
      ['豚', 'ぶた', 'ブタ', 'ポーク'],
      ['牛', 'うし', 'ウシ', 'ビーフ'],
      ['鮭', 'さけ', 'サケ', 'サーモン'],
      ['鯖', 'さば', 'サバ'],
      ['芋', 'いも', 'イモ', 'ポテト']
    ];
    
    let currentDraftTitle = "";
    let currentWorkerName = "未設定作業者";
    let lastSavedJsonStr = "";
    let autoSaveIntervalId = null;

    function findMasterEnglishByJa(jaText) {
      if (!jaText) return '';
      const cleanJa = jaText.trim();
      const matchedWithEn = singleMasterItems.find(
        item => (item.nameJa === cleanJa || item.internalName === cleanJa) && item.nameEn
      );
      return matchedWithEn ? matchedWithEn.nameEn : '';
    }

    function printLabels() {
      const confirmMsg = "【重要：印刷設定の確認】\n\n印刷ズレを防ぐため、次の印刷プレビュー画面で以下の2点を必ず確認してください。\n\n① 「余白」を【なし】にする\n② 「倍率」を【規定値】または【100%】にする\n\n確認して印刷プレビューに進みますか？";
      if (!confirm(confirmMsg)) return;

      const activeEl = document.querySelector('.label-cell.active-editing');
      if (activeEl) activeEl.classList.remove('active-editing');

      // ★修正: 現在のズーム倍率を退避し、印刷前に一時的に等倍(1.0)へ戻して長体を正確に再計算させる
      const savedZoom = currentZoom;
      currentZoom = 1.0;
      applyZoom(false, false);
      autoFitLongLines();

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const fileName = `商品ラベル${yyyy}${mm}${dd}_${hh}${min}${ss}`;
      const originalTitle = document.title;
      document.title = fileName;

      // DOMの等倍レンダリングを確実に反映させてから印刷ダイアログを起動
      setTimeout(() => {
        window.print();
        setTimeout(() => {
          document.title = originalTitle;
          // 印刷ダイアログ終了後、元のズーム倍率へ復元
          currentZoom = savedZoom;
          applyZoom(true, false);
          autoFitLongLines();
          if (activeEl && editingSlotIndex !== null) activeEl.classList.add('active-editing');
        }, 500);
      }, 150);
    }

    window.onload = function() {
      loadSpreadsheetMasters();
      updateUsageCount();
      renderAllSlots();
      startAutoSaveTimer();
      setTimeout(() => {
        setZoom(0.8); // ★ 初期表示の拡大率を 80% (0.8) に設定
      }, 50);
    };

    function loadSpreadsheetMasters() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            singleMasterItems = (res && res.singleItems) ? res.singleItems : [];
            setMasterPresets = (res && res.setPresets) ? res.setPresets : [];
            savedDraftList = (res && res.savedDrafts) ? res.savedDrafts : [];
            if (res && res.synonymGroups && res.synonymGroups.length > 0) {
              synonymMasterGroups = res.synonymGroups;
            }
            populateSetDropdown();
            populateDraftDropdown();
            currentDraftTitle = "";
            currentWorkerName = "未設定作業者";
            updateWorkInfoBadge();
            updateSaveStatusText('未保存', '#5f6368');
          })
          .withFailureHandler(function(err) {
            console.error('マスタ取得エラー:', err);
          })
          .getMasterDataFromSpreadsheet();
      }
    }

    function populateSetDropdown() {
      const sel = document.getElementById('selSetPresets');
      if (!sel) return;
      sel.innerHTML = '<option value="">-- セットを選択 --</option>';
      setMasterPresets.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${s.setName} (${s.prodsJa.length}品)`;
        sel.appendChild(opt);
      });
    }

    function updateWorkInfoBadge() {
      const el = document.getElementById('lblCurrentWorkInfo');
      if (!el) return;
      const t = currentDraftTitle || '未設定';
      const w = currentWorkerName || '未設定';
      el.innerText = `📝 保存名: ${t} | 👤 作業者: ${w}`;
    }

    function updateSaveStatusText(text, color = '#5f6368') {
      const el = document.getElementById('lblAutoSaveStatus');
      if (!el) return;
      el.innerText = text;
      el.style.color = color;
    }

    function populateDraftDropdown() {
      const sel = document.getElementById('selSavedDrafts');
      if (!sel) return;
      sel.innerHTML = '<option value="">📂 保存データから再開...</option>';
      savedDraftList.forEach((d, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        const workerStr = d.worker ? `👤${d.worker} | ` : '';
        opt.textContent = `${d.title} (${workerStr}${d.count}枚 | ${d.updatedAt})`;
        if (d.title === currentDraftTitle) opt.selected = true;
        sel.appendChild(opt);
      });
      updateWorkInfoBadge();
    }

    function startAutoSaveTimer() {
      if (autoSaveIntervalId) clearInterval(autoSaveIntervalId);
      autoSaveIntervalId = setInterval(function() {
        if (!currentDraftTitle) return;
        const usedCount = slotsData.filter(Boolean).length;
        if (usedCount === 0) return;
        executeSaveDraft(currentDraftTitle, currentWorkerName, true);
      }, 60000);
    }

    function saveCurrentWorkDraft() {
      const usedCount = slotsData.filter(Boolean).length;
      if (usedCount === 0) {
        alert('保存するラベルが1枚も作成されていません。');
        return;
      }
      const defaultTitle = currentDraftTitle || (() => {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        return `ラベル作業_${yyyy}${mm}${dd}`;
      })();

      const inputTitle = prompt('【1/2】保存名を確認・入力してください。', defaultTitle);
      if (inputTitle === null) return;
      const cleanTitle = inputTitle.trim();
      if (!cleanTitle) return;

      const inputWorker = prompt('【2/2】作業者名を確認・入力してください。', currentWorkerName !== "未設定作業者" ? currentWorkerName : '');
      if (inputWorker === null) return;
      const cleanWorker = inputWorker.trim() || '未設定';

      executeSaveDraft(cleanTitle, cleanWorker, false);
    }

    // --- 1. 保存処理（36枠ごとに分割してGASへ渡す） ---
    function executeSaveDraft(cleanTitle, cleanWorker, isAutoSave = false) {
      const chunkedMaps = []; // ページごとのデータを格納する配列
      let usedCount = 0;

      slotsData.forEach((d, idx) => {
        if (d && ((d.products && d.products.some(p => p.trim() !== "")) || (d.categoryText && d.categoryText.trim() !== ""))) {
          const page = Math.floor(idx / 36);
          if (!chunkedMaps[page]) chunkedMaps[page] = {};
          chunkedMaps[page][idx] = d;
          usedCount++;
        }
      });

      if (chunkedMaps.length === 0) chunkedMaps[0] = {}; // 空でも1ページ目は作成

      const jsonChunks = [];
      for (let i = 0; i < chunkedMaps.length; i++) {
        let chunkObj = { slotsMap: chunkedMaps[i] || {} };
        // 最初のシートのデータにのみ、ストック情報を含める（容量節約）
        if (i === 0) {
          chunkObj.stocks = stockItems;
          chunkObj.labelStocks = labelStockItems;
        }
        jsonChunks.push(JSON.stringify(chunkObj));
      }

      // オートセーブ用の比較（配列全体を文字列化して比較）
      const fullJsonStr = JSON.stringify(jsonChunks);
      if (isAutoSave && fullJsonStr === lastSavedJsonStr) return;

      google.script.run
        .withSuccessHandler(function(updatedList) {
          savedDraftList = updatedList || [];
          currentDraftTitle = cleanTitle;
          currentWorkerName = cleanWorker;
          lastSavedJsonStr = fullJsonStr;
          populateDraftDropdown();
          updateSaveStatusText('✓ 保存済', '#137333');
          if (!isAutoSave) alert('保存しました。');
        })
        .withFailureHandler(err => alert('保存エラー: ' + err))
        .saveDraftToSpreadsheet(cleanTitle, cleanWorker, jsonChunks, usedCount);
    }

    // --- 2. 読込処理（複数セルのデータを結合して復元） ---
    function loadSelectedWorkDraft(idxStr) {
      if (idxStr === "") return;
      const draft = savedDraftList[Number(idxStr)];
      if (!draft) return;

      try {
        const combinedMap = {};
        let parsedStocks = [];
        let parsedLabelStocks = [];

        // 旧フォーマット（jsonStr）と新フォーマット（jsonChunks）の両対応
        const chunks = draft.jsonChunks && draft.jsonChunks.length > 0 ? draft.jsonChunks : [draft.jsonStr];

        chunks.forEach((chunkStr, chunkIdx) => {
          if (!chunkStr) return;
          const parsed = JSON.parse(chunkStr);
          
          if (chunkIdx === 0) {
            parsedStocks = Array.isArray(parsed.stocks) ? parsed.stocks : [];
            parsedLabelStocks = Array.isArray(parsed.labelStocks) ? parsed.labelStocks : [];
          }

          if (parsed.slotsMap) {
            Object.assign(combinedMap, parsed.slotsMap);
          } else if (Array.isArray(parsed) || Array.isArray(parsed.slots)) {
            // 旧配列フォーマットのフォールバック
            const rawSlots = Array.isArray(parsed) ? parsed : (parsed.slots || []);
            rawSlots.forEach((item, idx) => {
              if (item) combinedMap[idx] = item;
            });
          }
        });

        // 結合したデータの最大インデックスから、必要な配列長（36の倍数）を算出
        const keys = Object.keys(combinedMap).map(Number);
        const maxIndex = keys.length > 0 ? Math.max(35, ...keys) : 35;
        const requiredLength = Math.ceil((maxIndex + 1) / 36) * 36;
        
        let parsedSlots = Array(requiredLength).fill(null);

        Object.keys(combinedMap).forEach(idxStrKey => {
          const idx = parseInt(idxStrKey, 10);
          const item = combinedMap[idxStrKey];
          if (idx >= 0 && item && typeof item === 'object') {
            let prods = Array.isArray(item.products) ? item.products : [item.product || ""];
            parsedSlots[idx] = {
              labelType: item.labelType || "main",
              categoryText: item.categoryText || "",
              products: prods.map(p => String(p || "")),
              subProducts: Array.isArray(item.subProducts) ? item.subProducts : prods.map(() => ""),
              productsAlt: Array.isArray(item.productsAlt) ? item.productsAlt : prods.map(() => ""),
              fontScale: item.fontScale || "normal",
              customFontPt: item.customFontPt !== undefined ? item.customFontPt : 10.0,
              marginPreset: item.marginPreset || "normal",
              customMarginY: item.customMarginY !== undefined ? item.customMarginY : 0.55,
              fontWeight: item.fontWeight || "700",
              heatingType: item.heatingType || "microwave",
              methodMin: item.methodMin !== undefined ? item.methodMin : "2",
              methodSec: item.methodSec !== undefined ? item.methodSec : "",
              methodText: item.methodText || "レンジ 600W で 2分温め",
              methodType: item.methodType || "warm"
            };
          }
        });

        slotsData = parsedSlots;
        stockItems = parsedStocks;
        labelStockItems = parsedLabelStocks;
        currentDraftTitle = draft.title;
        currentWorkerName = draft.worker || '未設定';
        lastSavedJsonStr = JSON.stringify(chunks);

        closeEditPanel();
        updateUsageCount();
        renderStockList();
        renderLabelStockList();
        renderAllSlots();
      } catch (e) {
        alert('読込エラー: ' + e.message);
      }
    }

    function deleteSelectedWorkDraft() {
      const sel = document.getElementById('selSavedDrafts');
      if (!sel || sel.value === "") return;
      const draft = savedDraftList[Number(sel.value)];
      if (!draft || !confirm(`「${draft.title}」を削除しますか？`)) return;

      google.script.run
        .withSuccessHandler(updatedList => {
          savedDraftList = updatedList || [];
          populateDraftDropdown();
        })
        .deleteDraftFromSpreadsheet(draft.title);
    }

    function applySetPresetToCurrentSlot(idxStr) {
      if (idxStr === "") return;
      if (editingSlotIndex === null) editingSlotIndex = 0;

      const s = setMasterPresets[Number(idxStr)];
      if (!s) return;

      const prods = [...s.prodsJa];
      slotsData[editingSlotIndex] = {
        categoryText: "",
        products: prods,
        subProducts: prods.map(() => ""),
        productsAlt: prods.map(() => ""),
        fontScale: "normal",
        customFontPt: 10.0,
        marginPreset: "normal",
        customMarginY: 0.55,
        fontWeight: "700",
        heatingType: "microwave",
        methodMin: "2",
        methodSec: "",
        methodText: s.methodText,
        methodType: "warm"
      };

      openEditPanel(editingSlotIndex);
      updateUsageCount();
      renderAllSlots();
    }

    function onSelectSingleMasterItem(rowIdx, selectedVal) {
      if (editingSlotIndex === null || !selectedVal) return;
      const data = slotsData[editingSlotIndex];
      if (!data) return;

      const matched = singleMasterItems.find(item => item.nameJa === selectedVal || item.internalName === selectedVal);
      if (!matched) return;

      data.products[rowIdx] = matched.nameJa;
      renderProductInputFields(data.products);
      renderAllSlots();
    }

    function selectHeatingMethod(methodKey) {
      if (editingSlotIndex === null) return;
      const data = slotsData[editingSlotIndex];
      if (!data) return;

      data.heatingType = methodKey;
      
      if (methodKey === 'cold') {
        data.methodType = 'cold';
        data.methodText = '冷たいまま';
      } else if (methodKey === 'doc') {
        data.methodType = 'warm';
        data.methodText = '別紙資料参照';
      } else if (methodKey === 'custom') {
        data.methodType = 'warm';
        data.methodText = ''; // ★ 自由入力の場合は枠内の文字を空欄にする
      } else {
        // microwave, boil, water
        data.methodType = 'warm';
        rebuildMethodTextFromState(data);
      }
      
      updateMethodUI();
      renderAllSlots();
    }

    function updateMethodUI() {
      if (editingSlotIndex === null) return;
      const data = slotsData[editingSlotIndex];
      if (!data) return;

      const methodKey = data.heatingType || 'microwave';
      
      // 各ボタンに紐付く固有の配色クラス定義
      const btnColorClasses = {
        microwave: 'warm-2',
        boil: 'warm-2',
        water: 'water',
        cold: 'cold',
        doc: 'doc',
        custom: 'custom'
      };

      // 各ボタンのクラスを正しく再構築（配色クラスを維持しつつ active を切り替え）
      ['microwave', 'boil', 'water', 'cold', 'doc', 'custom'].forEach(k => {
        const btn = document.getElementById(`mBtn_${k}`);
        if (btn) {
          const colorClass = btnColorClasses[k];
          if (k === methodKey) {
            btn.className = `btn-method-choice ${colorClass} active`;
          } else {
            btn.className = `btn-method-choice ${colorClass}`;
          }
        }
      });

      // ★ 時間入力欄の表示制御（cold, doc, custom の場合は非表示、それ以外は表示）
      const timeWrap = document.getElementById('methodTimeInputWrap');
      if (timeWrap) {
        timeWrap.style.display = (methodKey === 'cold' || methodKey === 'doc' || methodKey === 'custom') ? 'none' : 'flex';
      }

      document.getElementById('inputMethodMin').value = data.methodMin || '';
      document.getElementById('inputMethodSec').value = data.methodSec || '';
      document.getElementById('inputCustomMethod').value = data.methodText || '';
    }

    function rebuildMethodTextFromState(data) {
      const dur = buildDurationString(data.methodMin, data.methodSec);
      if (data.heatingType === 'boil') {
        data.methodText = dur ? `湯煎で ${dur}温め` : '湯煎で温め';
      } else if (data.heatingType === 'water') {
        data.methodText = dur ? `流水解凍で ${dur}` : '流水解凍';
      } else if (data.heatingType === 'doc') {
        data.methodText = '別紙参照';
      } else if (data.heatingType === 'microwave') {
        data.methodText = dur ? `レンジ 600W で ${dur}温め` : 'レンジ 600W で温め';
      }
    }

    function sanitizeHalfWidthDigits(str) {
      if (!str) return '';
      return String(str).replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
    }

    function onSplitTimeInput() {
      if (editingSlotIndex === null) return;
      const data = slotsData[editingSlotIndex];
      if (!data || data.heatingType === 'cold') return;

      data.methodMin = sanitizeHalfWidthDigits(document.getElementById('inputMethodMin').value);
      data.methodSec = sanitizeHalfWidthDigits(document.getElementById('inputMethodSec').value);

      rebuildMethodTextFromState(data);
      renderAllSlots();
    }



    function buildDurationString(minStr, secStr) {
      const m = parseInt(minStr, 10) || 0;
      const s = parseInt(secStr, 10) || 0;
      let ja = '';
      if (m > 0 && s > 0) ja = `${m}分${s}秒`;
      else if (m > 0) ja = `${m}分`;
      else if (s > 0) ja = `${s}秒`;
      return ja;
    }

    

    function onCustomMethodInput(val) {
      if (editingSlotIndex === null) return;
      slotsData[editingSlotIndex].methodText = val;
      renderAllSlots();
    }

    

    function toggleMethodLanguage() {
      if (editingSlotIndex === null) return;
      const data = slotsData[editingSlotIndex];
      if (!data) return;
      data.methodText = data.methodText.includes('Microwave') ? 'レンジ 600W で 2分温め' : 'Microwave 600W for 2 min';
      renderAllSlots();
    }

    function deleteCurrentSlot() {
      if (editingSlotIndex === null) return;
      slotsData[editingSlotIndex] = null;
      closeEditPanel();
    }

    function quickDeleteSlot(e, slotIdx) {
      if (e) e.stopPropagation();
      slotsData[slotIdx] = null;
      if (editingSlotIndex === slotIdx) closeEditPanel();
      else { updateUsageCount(); renderAllSlots(); }
    }

    function clearSingleProductRow(idx) {
      if (editingSlotIndex === null) return;
      const data = slotsData[editingSlotIndex];
      if (!data || !data.products) return;
      data.products[idx] = '';
      if (data.subProducts) data.subProducts[idx] = '';
      renderProductInputFields(data.products);
      renderAllSlots();
    }

    function updateUsageCount() {
      const used = slotsData.filter(d => d && ((d.products && d.products.some(p => p.trim() !== "")) || (d.categoryText && d.categoryText.trim() !== ""))).length;
      document.getElementById('lblTotalUsage').innerText = `作成中: ${used} / 36枚`;
    }

    async function toggleAllProductsLanguage() {
      if (editingSlotIndex === null) return;
      const data = slotsData[editingSlotIndex];
      if (!data || !data.products) return;

      for (let i = 0; i < data.products.length; i++) {
        const cur = data.products[i];
        if (cur && !data.productsAlt[i]) {
          data.productsAlt[i] = await translateTextToEnglish(cur);
        }
        if (data.productsAlt[i]) {
          data.products[i] = data.productsAlt[i];
          data.productsAlt[i] = cur;
        }
      }
      renderProductInputFields(data.products);
      renderAllSlots();
    }

    async function translateTextToEnglish(text) {
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=en&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const json = await res.json();
        return json[0].map(item => item[0]).join('');
      } catch (e) {
        return text;
      }
    }

    function getEffectiveFontSettings(data) {
      return { fontSizePt: data.customFontPt || 10.0, marginY: data.customMarginY || 0.55, fontWeight: data.fontWeight || '700' };
    }

    function renderAllSlots() {
      const container = document.getElementById('sheetsContainer');
      container.innerHTML = '';
      
      // ★変更1: slotsDataの長さを常に36の倍数に保つ（空き枠をnullで埋める）
      while (slotsData.length % 36 !== 0) {
        slotsData.push(null);
      }
      // もし配列が空なら、最低1シート分（36枠）を確保する
      if (slotsData.length === 0) {
        slotsData = Array(36).fill(null);
      }

      // 必要なA4シートの数を算出
      const totalSheets = slotsData.length / 36;

      // ★変更2: 必要なシート数だけループして、A4シートのDOMを複数生成する
      for (let page = 0; page < totalSheets; page++) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet-a4';
        sheet.style.marginBottom = '30px'; // 画面上でシート同士を区切る隙間

        const grid = document.createElement('div');
        grid.className = 'label-grid';

        // 1シートにつき36枠のセルを生成
        for (let i = 0; i < 36; i++) {
          const globalIndex = page * 36 + i; // 0〜35, 36〜71, 72〜107... という通し番号
          const data = slotsData[globalIndex];
          
          // データが入力されているかの判定
          const hasData = Boolean(data && ((data.products && data.products.some(p => p.trim() !== "")) || (data.categoryText && data.categoryText.trim() !== "")));

          let cellClass = hasData ? 'label-cell has-data' : 'label-cell empty-cell';
          if (globalIndex === editingSlotIndex) cellClass += ' active-editing';
          
          const cell = document.createElement('div');
          cell.className = cellClass;
          cell.dataset.slotIndex = globalIndex;
          cell.draggable = hasData;

          // -- ドラッグ＆ドロップ系のイベント --
          cell.ondragstart = function(e) {
            draggedSlotIndex = globalIndex;
            isDraggingActive = true;
            cell.classList.add('is-dragging');
            e.dataTransfer.setData('text/plain', JSON.stringify({ type: 'slotMove', index: globalIndex }));
            e.dataTransfer.effectAllowed = 'copyMove';
            document.getElementById('customDragBadge').style.display = 'inline-flex';
          };
          
          cell.ondragend = function(e) {
            cell.classList.remove('is-dragging');
            document.querySelectorAll('.label-cell').forEach(c => c.classList.remove('drag-over'));
            draggedSlotIndex = null;
            setTimeout(() => { isDraggingActive = false; }, 100);
            document.getElementById('customDragBadge').style.display = 'none';
          };
          
          cell.ondragover = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = e.ctrlKey ? 'copy' : 'move';
            cell.classList.add('drag-over');
          };
          
          cell.ondragleave = function() { cell.classList.remove('drag-over'); };
          
          cell.ondrop = function(e) {
            e.preventDefault();
            cell.classList.remove('drag-over');

            const rawData = e.dataTransfer.getData('text/plain');
            if (!rawData) return;
            
            let parsed = null;
            try { 
              parsed = JSON.parse(rawData); 
            } catch(err) { 
              parsed = { type: 'slotMove', index: parseInt(rawData, 10) }; 
            }

            // ラベルストックからのドロップ
            if (parsed.type === 'labelStockItem') {
              const stockIndex = parsed.stockIndex;
              const stockItem = labelStockItems[stockIndex];
              if (stockItem) {
                slotsData[globalIndex] = JSON.parse(JSON.stringify(stockItem));
                updateUsageCount();
                renderAllSlots();
                openEditPanel(globalIndex);
              }
              return;
            }
            
            // 料理名ストックからのドロップ
            if (parsed.type === 'stockItem') {
              const stockName = parsed.value;
              if (!slotsData[globalIndex] || !slotsData[globalIndex].products || slotsData[globalIndex].products.every(p => !p || p.trim() === '')) {
                slotsData[globalIndex] = {
                  categoryText: "",
                  products: [stockName],
                  subProducts: [""],
                  productsAlt: [""],
                  fontScale: "normal",
                  customFontPt: 10.0,
                  marginPreset: "normal",
                  customMarginY: 0.55,
                  fontWeight: "700",
                  heatingType: "microwave",
                  methodMin: "2",
                  methodSec: "",
                  methodText: "レンジ 600W で 2分温め",
                  methodType: "warm"
                };
                updateUsageCount();
                renderAllSlots();
                openEditPanel(globalIndex);
              } else {
                openStockDropChoiceModal(globalIndex, stockName);
              }
              return;
            }

            // セル間の移動・コピー
            if (parsed.type === 'slotMove') {
              const sourceIdx = parsed.index;
              if (sourceIdx !== null && sourceIdx !== globalIndex) {
                if (e.ctrlKey) {
                  // コピー
                  if (slotsData[sourceIdx]) {
                    slotsData[globalIndex] = JSON.parse(JSON.stringify(slotsData[sourceIdx]));
                  }
                } else {
                  // 移動（スワップ）
                  const temp = slotsData[globalIndex];
                  slotsData[globalIndex] = slotsData[sourceIdx];
                  slotsData[sourceIdx] = temp;
                  if (editingSlotIndex === sourceIdx) editingSlotIndex = globalIndex;
                  else if (editingSlotIndex === globalIndex) editingSlotIndex = sourceIdx;
                }
                updateUsageCount();
                renderAllSlots();
                if (editingSlotIndex !== null) openEditPanel(editingSlotIndex);
              }
              return;
            }
          };

          cell.onclick = function() {
            if (!isDraggingActive) openEditPanel(globalIndex);
          };

          // セルの中身を描画
          let cellHtml = `<span class="slot-num-badge">#${globalIndex + 1}</span>`;
          if (hasData) {
            cellHtml += `<button type="button" class="cell-quick-del-btn" onclick="quickDeleteSlot(event, ${globalIndex})">✕</button>`;
            cellHtml += buildLabelDesignHtml(data);
          }
          cell.innerHTML = cellHtml;
          grid.appendChild(cell);
        }
        
        // グリッドをシートに追加し、シートをコンテナに追加
        sheet.appendChild(grid);
        container.appendChild(sheet);
      }

      // ズームと長体の再計算
      applyZoom(false, false); 
      setTimeout(autoFitLongLines, 10);
    }

    function autoFitLongLines() {
      document.querySelectorAll('.design-card').forEach(card => {
        const containerWidth = card.clientWidth > 0 ? card.clientWidth - 16 : 173; 
        const lineWrappers = card.querySelectorAll('.product-subline-wrapper');
        const tspanList = [];
        
        lineWrappers.forEach(wrap => {
          const span = wrap.querySelector('.card-product-line');
          if (!span) return;
          span.style.transform = 'none';
          span.style.transformOrigin = 'center center';
          span.style.display = 'inline-block';
          span.style.whiteSpace = 'nowrap';
          const w = span.scrollWidth;
          tspanList.push({ element: span, naturalWidth: w });
        });

        const maxAllowedLength = containerWidth;
        let minCompressionRatio = 1.0;
        tspanList.forEach(item => {
          if (item.naturalWidth > maxAllowedLength) {
            const ratio = maxAllowedLength / item.naturalWidth;
            if (ratio < minCompressionRatio) minCompressionRatio = ratio;
          }
        });

        tspanList.forEach(item => {
          const span = item.element;
          if (typeof isUniformStretch !== 'undefined' && isUniformStretch) {
            if (minCompressionRatio < 1.0) {
              span.style.transform = `scaleX(${minCompressionRatio.toFixed(3)})`;
            }
          } else {
            if (item.naturalWidth > maxAllowedLength) {
              const ratio = maxAllowedLength / item.naturalWidth;
              span.style.transform = `scaleX(${ratio.toFixed(3)})`;
            }
          }
        });
      });
    }

    function handleLabelStockDrop(e) {
      e.preventDefault();
      console.log('=== handleLabelStockDrop 実行開始 ===');
      try {
        const raw = e.dataTransfer.getData('text/plain');
        console.log('受信した生データ:', raw);
        if (!raw) {
          console.warn('データが空です');
          return;
        }

        let parsed = null;
        try {
          parsed = JSON.parse(raw);
        } catch (jsonErr) {
          console.warn('JSONパース失敗、数値として処理します:', raw);
          parsed = { type: 'slotMove', index: parseInt(raw, 10) };
        }

        console.log('パース結果:', parsed);

        // プレビューのラベル枠（スロット）からドラッグされた場合
        if (parsed.type === 'slotMove') {
          const sourceIndex = parsed.index;
          const slotData = slotsData[sourceIndex];
          if (slotData) {
            // 複製データを作成
            const newStockItem = JSON.parse(JSON.stringify(slotData));

            // ★ 同一のラベルがすでにラベルストック内に存在するかチェック
            const isAlreadyExists = labelStockItems.some(item => {
              return JSON.stringify(item) === JSON.stringify(newStockItem);
            });

            if (isAlreadyExists) {
              alert('このラベルはすでにラベルストックに登録されています。');
              return; // 登録を中断
            }

            // 1. ラベルストックに複製を追加
            labelStockItems.push(newStockItem);
            
            // 2. 元のプレビュー枠をクリア（削除）
            slotsData[sourceIndex] = null;
            
            // 3. 編集パネルが開いていた枠であれば閉じる
            if (editingSlotIndex === sourceIndex) {
              closeEditPanel();
            }
            
            // 4. 画面全体（使用数・プレビュー・ストック一覧）を更新
            updateUsageCount();
            renderAllSlots();
            renderLabelStockList();
            
            // 5. 自動でラベルストックタブに切り替える
            switchStockTab('label');
          }
        }
      } catch (err) {
        console.error('handleLabelStockDrop 内部エラー:', err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ▼ 修正後の完全復元されたズーム関数群
    function onZoomSliderInput(val) {

    function applyZoom(updateSlider = true, focusSelected = true) {
      const container = document.getElementById('sheetsContainer');
      if (!container) return;
      
      // 画面内にあるすべてのA4シート要素を取得する
      const sheets = container.querySelectorAll('.sheet-a4');
      if (sheets.length === 0) return;

      // 基準となる1枚目のシートからサイズを取得
      const firstSheet = sheets[0];
      const baseWidth = firstSheet.offsetWidth || 794;
      const baseHeight = firstSheet.offsetHeight || 1123;
      
      // コンテナ全体のサイズを「シート数 × 縦の高さ」に合わせて拡張する
      container.style.width = Math.round(baseWidth * currentZoom) + 'px';
      container.style.height = Math.round((baseHeight * totalSheetsHeight()) * currentZoom) + 'px'; // 修正: 全シートの総高さを考慮
      container.style.transform = 'none';
      container.style.marginLeft = 'auto';
      container.style.marginRight = 'auto';

      // ★重要: すべてのシート（1P目も2P目以降も）に対して、同一のスケールと変形基点を一括適用する
      sheets.forEach((sheet, idx) => {
        sheet.style.transformOrigin = 'top left';
        sheet.style.transform = `scale(${currentZoom.toFixed(3)})`;
        // 2枚目以降のシートが重ならないよう、縦方向に適切なマージン（隙間）を持たせる
        if (idx > 0) {
          sheet.style.marginTop = '20px';
        }
      });
      
      document.getElementById('lblZoomVal').innerText = Math.round(currentZoom * 100) + '%';

      if (updateSlider) {
        const slider = document.getElementById('zoomRangeInput');
        if (slider) slider.value = currentZoom;
      }

      if (focusSelected && editingSlotIndex !== null) {
        scrollToEditingSlot(editingSlotIndex, false);
      }
    }

    // ヘルパー: 全シートの合計高さを計算する関数
    function totalSheetsHeight() {
      const container = document.getElementById('sheetsContainer');
      if (!container) return 1;
      const count = container.querySelectorAll('.sheet-a4').length;
      return Math.max(1, count);
    }

    function changeZoom(delta) { 
      currentZoom = Math.min(2.0, Math.max(0.3, currentZoom + delta)); 
      applyZoom(); 
    }
    
    function setZoom(val) { 
      currentZoom = Math.min(2.0, Math.max(0.3, val)); 
      applyZoom(); 
    }
    
    function fitPage() {
      const outerArea = document.getElementById('previewOuterArea');
      const headerH = document.getElementById('topControlPanel').offsetHeight || 90;
      const availableW = (outerArea ? outerArea.clientWidth : (window.innerWidth - 800));
      const availableH = window.innerHeight - headerH - 40;
      const fitScale = Math.min(availableW / 794, availableH / 1123);
      setZoom(Math.max(0.35, fitScale));
    }

    document.addEventListener('mouseover', function(e) {
      const card = e.target.closest('.label-stock-card');
      if (!card) return;

      // どのインデックスのラベルか、HTML要素のデータ属性等から特定するか、
      // あるいは要素自身からインデックスを逆引きできるようにします。
      // ここでは簡易的に、親コンテナ内の何番目かを特定してデータを取得します。
    });

    // より確実に紐付けるため、renderLabelStockList 内でカード生成時に mouseenter / mouseleave をバインドします。
  
    let pendingDropData = null;

    function openStockDropChoiceModal(slotIndex, stockName) {
      pendingDropData = { slotIndex: slotIndex, stockName: stockName };
      const products = slotsData[slotIndex].products || [];

      const container = document.getElementById('dropChoiceButtonsContainer');
      let html = '';

      // ① 既存のすべての有効な品目（品名1〜4）それぞれに対して結合ボタンを生成
      products.forEach((prod, idx) => {
        if (prod && prod.trim() !== "") {
          html += `
            <button type="button" class="btn-main" style="background:#e8f0fe; color:#1a73e8; border:1.5px solid #c2e7ff; padding:10px; justify-content:flex-start; font-size:12.5px;" onclick="executeStockDropChoice('combine', ${idx})">
              🔗 品名 ${idx + 1}（「${escapeHtml(prod.trim())}」）の後ろに結合する
            </button>
          `;
        }
      });

      // 空の枠があるか、または配列長が4未満かをチェック
      const emptyIdx = products.findIndex(p => !p || p.trim() === "");
      const canAddNewRow = (emptyIdx !== -1) || (products.length < 4);
      const nextRowNum = (emptyIdx !== -1) ? (emptyIdx + 1) : (products.length + 1);

      // ② 新たな品名として独立して追加する選択肢（最大4品まで）
      if (canAddNewRow) {
        html += `
          <button type="button" class="btn-main" style="background:#e6f4ea; color:#137333; border:1.5px solid #ceead6; padding:10px; justify-content:flex-start; font-size:12.5px;" onclick="executeStockDropChoice('newRow')">
            ➕ 新たな品名（品名 ${nextRowNum}）として独立して追加する
          </button>
        `;
      } else {
        html += `<div style="color:#5f6368; font-weight:bold; font-size:11.5px; text-align:center; padding:6px;">※すでに最大4品登録されているため、新規行の追加はできません（既存品目への結合は可能です）。</div>`;
      }

      container.innerHTML = html;
      document.getElementById('dropChoiceModal').style.display = 'flex';
    }

    function executeStockDropChoice(mode, targetIdx = 0) {
      if (!pendingDropData) {
        cancelDropChoice();
        return;
      }
      const { slotIndex, stockName } = pendingDropData;
      const data = slotsData[slotIndex];

      if (mode === 'combine') {
        // ① 指定されたインデックス（targetIdx: 品名1〜4）の後ろに結合
        if (data.products && data.products[targetIdx] !== undefined) {
          const currentBase = data.products[targetIdx].trim();
          data.products[targetIdx] = currentBase ? `${currentBase} ${stockName}` : stockName;
        }
      } else if (mode === 'newRow') {
        // ② 新たな品名（空き行があればそこへ、なければ末尾）として追加
        if (!data.products) data.products = [];
        if (!data.subProducts) data.subProducts = [];
        if (!data.productsAlt) data.productsAlt = [];
        
        const emptyIdx = data.products.findIndex(p => !p || p.trim() === "");
        if (emptyIdx !== -1) {
          // 既存の空行（例：「2品」ボタンを押して空になっている品名2など）があればそこへ格納
          data.products[emptyIdx] = stockName;
          if (data.subProducts[emptyIdx] === undefined) data.subProducts[emptyIdx] = "";
          if (data.productsAlt[emptyIdx] === undefined) data.productsAlt[emptyIdx] = "";
        } else {
          if (data.products.length >= 4) {
            alert('1つのラベルに記載できる商品は最大4品までです。');
            cancelDropChoice();
            return;
          }
          data.products.push(stockName);
          data.subProducts.push("");
          data.productsAlt.push("");
        }
      }

      cancelDropChoice();

      editingSlotIndex = slotIndex;
      document.getElementById('panelSlotTitle').innerText = `ラベル枠 #${slotIndex + 1} を編集`;
      document.getElementById('inputCategoryText').value = data.categoryText || '';

      const count = Math.max(1, Math.min(4, data.products.length));
      highlightChoiceButton('btnCount', count);
      renderProductInputFields(data.products);
      updateControlsUI();
      updateMethodUI();

      updateUsageCount();
      renderAllSlots();
    }

    function cancelDropChoice() {
      pendingDropData = null;
      document.getElementById('dropChoiceModal').style.display = 'none';
    }

    function clearAllLabelStock() {
      console.log('=== clearAllLabelStock 実行開始 ===');
      
      // 確認ダイアログを表示
      if (!confirm('すべての保管ラベルを削除しますか？')) {
        console.log('クリア操作がキャンセルされました。');
        return;
      }

      try {
        // 1. ホバープレビューの強制非表示
        const popup = document.getElementById('globalHoverPreviewPopup');
        if (popup) {
          popup.style.display = 'none';
        }

        // 2. 配列の初期化
        labelStockItems = [];
        console.log('labelStockItems を空にしました:', labelStockItems);

        // 3. リストの再描画
        renderLabelStockList();
        console.log('ラベルストックリストの再描画が完了しました。');

      } catch (err) {
        console.error('clearAllLabelStock 実行時エラー:', err);
        alert('クリア処理中にエラーが発生しました: ' + err.message);
      }
    }

function copyToRemainingEmptySlots() {
      if (editingSlotIndex === null) {
        alert('コピー元のラベル枠が選択されていません。');
        return;
      }
      const cur = slotsData[editingSlotIndex];
      if (!cur || (!cur.products.some(p => p && p.trim() !== "") && !cur.categoryText.trim())) {
        alert('選択中の枠に有効なデータが入っていません。');
        return;
      }

      // 空白枠の数をカウント
      const emptyCount = slotsData.filter(d => !d || (!d.products.some(p => p && p.trim() !== "") && !d.categoryText.trim())).length;
      if (emptyCount === 0) {
        alert('コピー先の空白枠がありません。');
        return;
      }

      if (!confirm(`残りのすべての空白枠（${emptyCount}枠）に、このラベルをコピーして埋めますか？`)) {
        return;
      }

      // 36枠を走査し、データが入っていない（空白の）枠にのみ複製を代入
      for (let i = 0; i < 36; i++) {
        const d = slotsData[i];
        const isEmpty = !d || (!d.products.some(p => p && p.trim() !== "") && !d.categoryText.trim());
        if (isEmpty) {
          slotsData[i] = JSON.parse(JSON.stringify(cur));
        }
      }

      updateUsageCount();
      renderAllSlots();
      alert('残りの空白枠にコピーしました。');
    }

    function scrollToEditingSlot(slotIdx, useSmooth = true) {
      if (slotIdx === null || slotIdx === undefined) return;
      const outerArea = document.getElementById('previewOuterArea');
      const container = document.getElementById('sheetsContainer');
      if (!outerArea || !container) return;

      const sheet = container.querySelector('.sheet-a4');
      const baseWidth = sheet ? sheet.offsetWidth : 794;
      const baseHeight = sheet ? sheet.offsetHeight : 1123;

      // 36面グリッド上の「列(0〜3)」と「段(0〜8)」を算出
      const col = slotIdx % 4;
      const row = Math.floor(slotIdx / 4);

      // A4シート(210mm x 297mm)に対する実際のピクセル比率
      const pxPerMmX = baseWidth / 210.0;
      const pxPerMmY = baseHeight / 297.0;

      // シート左上(0,0)から、対象ラベルの「中心点」までの物理座標(mm)
      // 左余白:5mm + (列 × 幅50mm) + 半分25mm
      // 上余白:5.5mm + (段 × [高30mm + 間隔2mm]) + 半分15mm
      const cellCenterMmX = 5.0 + (col * 50.0) + 25.0;
      const cellCenterMmY = 5.5 + (row * 32.0) + 15.0;

      // 現在のズーム倍率を掛けた、シート左上からの正確なピクセル中心座標
      const targetCenterX = (cellCenterMmX * pxPerMmX) * currentZoom;
      const targetCenterY = (cellCenterMmY * pxPerMmY) * currentZoom;

      // .preview-outer の padding（左: 60px, 上: 20px）と margin:auto 分の余白を正確に算出
      const scaledSheetWidth = baseWidth * currentZoom;
      const innerAvailableWidth = outerArea.clientWidth - 120; // 左右padding(60px×2)を引いた幅
      const autoMarginLeft = scaledSheetWidth < innerAvailableWidth ? (innerAvailableWidth - scaledSheetWidth) / 2 : 0;

      const sheetStartX = 60 + autoMarginLeft;
      const sheetStartY = 20; // 上padding(20px)

      // 表示領域（outerArea）の真ん中にラベルの中心が来るようにスクロール位置を算出
      const scrollLeft = sheetStartX + targetCenterX - (outerArea.clientWidth / 2);
      const scrollTop = sheetStartY + targetCenterY - (outerArea.clientHeight / 2);

      outerArea.scrollTo({
        left: Math.max(0, Math.round(scrollLeft)),
        top: Math.max(0, Math.round(scrollTop)),
        behavior: useSmooth ? 'smooth' : 'auto'
      });
    }
    
  </script>
