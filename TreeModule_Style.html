<style>
  /* -----------------------------------------------------------
     ツリー入力システム専用 CSS (既存の36面CSSとの干渉を防ぐため t- プレフィックスを使用)
     ----------------------------------------------------------- */
  .t-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.8); z-index: 3000;
    display: none; align-items: center; justify-content: center;
  }
  .t-modal-container {
    background: #f7f4ed; width: 95vw; height: 90vh;
    border-radius: 12px; display: flex; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden;
    font-family: "Yu Gothic Medium", "YuGothic", sans-serif;
  }
  .t-header {
    background: #ffffff; padding: 12px 20px; border-bottom: 1px solid #dcd6ce;
    display: flex; justify-content: space-between; align-items: center;
  }
  .t-header h2 { margin: 0; font-size: 18px; color: #3d2314; font-weight: bold; }
  .t-body { display: flex; gap: 20px; padding: 20px; flex: 1; overflow: hidden; }
  
  .t-panel-left {
    flex: 1; background: #ffffff; border-radius: 10px; padding: 18px;
    display: flex; flex-direction: column; gap: 15px; overflow-y: auto; border: 1px solid #dcd6ce;
  }
  .t-panel-right {
    width: 440px; background: #ffffff; border-radius: 10px; padding: 18px;
    display: flex; flex-direction: column; gap: 15px; overflow-y: auto; border: 1px solid #dcd6ce; flex-shrink: 0;
  }

  .t-panel-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dcd6ce; padding-bottom: 6px; margin-bottom: 6px; }
  .t-panel-title { font-size: 14px; font-weight: bold; color: #3d2314; }

  .t-tree-set-box { background: #faf8f5; border: 1px solid #dcd6ce; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .t-tree-set-header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed #dcd6ce; }

  .t-step-section-1 { background: #ffffff; border: 2px solid #b0a8a0; border-radius: 8px; padding: 14px; margin-bottom: 15px; }
  .t-step-section-2 { background: #f4f8f4; border: 2px solid #2e7d32; border-radius: 8px; padding: 14px; margin-top: 15px; }
  .t-step-banner { font-size: 13px; font-weight: bold; padding: 4px 8px; border-radius: 4px; margin-bottom: 10px; display: inline-block; }
  .t-step-banner.s1 { background: #e8e3dc; color: #3d2314; }
  .t-step-banner.s2 { background: #2e7d32; color: #ffffff; }

  .t-comb-group-card { background: #fffdf9; border: 1.5px solid #d4a373; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .t-single-item-card { background: #fdfdfd; border: 1px solid #dcd6ce; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  
  .t-tree-node-row { background: #ffffff; border: 1px solid #dcd6ce; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; transition: border-color 0.2s, box-shadow 0.2s; }
  .t-tree-node-row.active-hover { border-color: #d32f2f; box-shadow: 0 0 8px rgba(211, 47, 47, 0.3); background-color: #fff8f8; }

  .t-input-group { display: flex; gap: 10px; align-items: center; }
  .t-input-group label { font-size: 12px; color: #555; font-weight: bold; flex-shrink: 0; width: 40px; }
  
  .t-input-text { background: #ffffff; border: 1px solid #dcd6ce; color: #2b2b2b; padding: 5px 8px; border-radius: 5px; font-size: 13px; font-weight: bold; flex: 1; font-family: inherit; }
  .t-input-text::placeholder { color: #b0a8a0; font-weight: normal; }
  .t-input-num { width: 50px; background: #ffffff; border: 1px solid #dcd6ce; color: #2b2b2b; padding: 5px; border-radius: 5px; text-align: center; font-size: 13px; font-weight: bold; }

  .t-btn-main { background: #3d2314; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
  .t-btn-main:hover { background: #52311c; }
  .t-btn-secondary { background: #555; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
  .t-btn-danger { background: #b71c1c; color: white; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
  
  .t-btn-heat-choice { padding: 5px 0; font-size: 11px; font-weight: bold; border-radius: 4px; border: 1.5px solid transparent; cursor: pointer; color: white; text-align: center; flex: 1; }
  .t-btn-heat-choice.range { background: #b71c1c; } 
  .t-btn-heat-choice.yusen { background: #b71c1c; } 
  .t-btn-heat-choice.cold { background: #0288d1; }  
  .t-btn-heat-choice.besshi { background: #2e7d32; }
  .t-btn-heat-choice.active { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1a73e8; }

  .t-time-wrap { display: flex; align-items: center; gap: 6px; background: #ffffff; padding: 4px 8px; border: 1px solid #dadce0; border-radius: 4px; }
  
  .t-outer-option-wrap { display: flex; align-items: center; gap: 6px; background: #f8f9fa; padding: 6px 10px; border-radius: 6px; border: 1px solid #e0e0e0; }
  .t-btn-outer-choice { padding: 4px; font-size: 10px; font-weight: bold; border-radius: 4px; border: 1.5px solid #dcd6ce; cursor: pointer; background: #ffffff; color: #2b2b2b; text-align: center; }
  .t-btn-outer-choice.active { background: #3d2314; color: #ffffff; border-color: #3d2314; }

  /* プレビューエリア専用CSS */
  .t-preview-tree-group { background: #faf8f5; border: 1px solid #dcd6ce; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
  .t-preview-parent-row, .t-preview-child-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .t-preview-children-box { display: flex; flex-direction: column; gap: 10px; padding-left: 20px; position: relative; margin-top: 6px; }
  .t-preview-children-box::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 12px; width: 2px; background: #b71c1c; }
  .t-preview-copies-badge { font-size: 12px; font-weight: bold; color: #3d2314; background: #f4eae1; padding: 4px 8px; border-radius: 5px; border: 1px solid #dcd6ce; }

  .t-label-preview-card {
    width: 220px; height: 130px; background: #ffffff; color: #2b2b2b; border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); border: 1px solid #dcd6ce; display: flex; flex-direction: column;
    justify-content: space-between; padding: 0 10px; box-sizing: border-box; position: relative; flex-shrink: 0;
    transition: all 0.2s ease; cursor: pointer;
  }
  .t-label-preview-card.highlighted { border-color: #d32f2f; box-shadow: 0 0 12px rgba(211, 47, 47, 0.4); transform: scale(1.02); }
  .t-label-preview-card.comb-card { border-left: 5px solid #d4a373; background: #ffffff; }
  .t-label-preview-card.single-card { border-left: 5px solid #607d8b; background: #ffffff; }
  .t-label-preview-card.outer-bag { border-left: none; background: #ffffff; }

  .t-p-header { height: 26px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 0.75px solid #2b2b2b; padding-bottom: 2px; box-sizing: border-box; }
  .t-p-logo-svg { height: 10px; fill: #2b2b2b; }
  .t-p-cat-wrapper { flex: 1; display: flex; justify-content: flex-end; margin-left: 6px; overflow: hidden; }
  .t-p-outer-cat { font-size: 7pt; font-weight: bold; white-space: nowrap; color: #0288d1; }
  .t-p-set-cat { font-size: 7pt; font-weight: bold; white-space: nowrap; color: #2b2b2b; }

  .t-p-body-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 2px; overflow: hidden; }
  .t-p-line-wrapper { width: 100%; display: flex; justify-content: center; }
  .t-p-item-name { font-size: 10.5pt; font-weight: 700; color: #2b2b2b; line-height: 1.1; white-space: nowrap; }
  .t-p-item-sub { font-size: 7pt; color: #555555; line-height: 1.1; white-space: nowrap; margin-top:2px; }
  
  .t-p-footer { height: 23px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 2px; padding-top: 2px; }
  .t-p-green-line { width: 100%; height: 1.25pt; }
  .t-p-footer-instruction { font-size: 7.5pt; font-weight: 700; line-height: 1; }

  /* ステップ3専用スタイル（青ベースで視覚的に区別） */
  .t-step-section-3 { background: #f0f7ff; border: 2px solid #1a73e8; border-radius: 8px; padding: 14px; margin-top: 15px; }
  .t-step-banner.s3 { background: #1a73e8; color: #ffffff; }
</style>
