  let t_treeData = [];

  function openTreeModal() {
    document.getElementById('treeModalOverlay').style.display = 'flex';
    t_render();
  }
  function closeTreeModal() {
    document.getElementById('treeModalOverlay').style.display = 'none';
  }

  function applyTreeToSlots() {
    alert("【将来の連携予定】\nここで作成したツリーデータを36面スロットに自動展開するロジックを実装します。");
  }

  // --- ツリー描画 ---
  function t_render() {
    const inputPanel = document.getElementById('t-treeInputPanel');
    const previewPanel = document.getElementById('t-treePreviewPanel');
    
    let htmlLeft = `<div class="t-panel-header-row"><div class="t-panel-title">ツリー構成の構築と詳細入力</div></div>`;
    let htmlRight = `<div class="t-panel-header-row"><div class="t-panel-title">ツリー連動印刷プレビュー</div></div>`;

    if (t_treeData.length === 0) {
      inputPanel.innerHTML = htmlLeft + `
        <div style="text-align:center; padding:40px; color:#777;">
          <p>外袋セットがまだ登録されていません。</p>
          <button class="t-btn-main" style="background:#e65100; border:1px solid #ef6c00;" onclick="t_addSetGroup()">＋ 外袋セットを追加する</button>
        </div>
      `;
      previewPanel.innerHTML = htmlRight + `<div style="text-align:center; padding:40px; color:#777;">プレビューはありません</div>`;
      return;
    }

    t_treeData.forEach((group) => {
      const outerOpt = group.outerOption || "1";

      let step1ItemsHtml = '';
      if (group.items.length === 0) {
        step1ItemsHtml = `<div style="color:#888; font-size:12px; padding:12px; text-align:center;">料理やパックがまだ追加されていません。</div>`;
      } else {
        group.items.forEach((item) => {
          if (item.type === 'combination') {
            let packsListHtml = '';
            const canDeletePack = item.packs.length > 2;
            item.packs.forEach(p => {
              packsListHtml += `
                <div style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12.5px;">
                  <span style="color:#b71c1c; font-weight:bold;">〇</span>
                  <span style="font-size:11px; color:#555; width:55px;">パック名:</span>
                  <!-- ★修正: this.value を this に変更 -->
                  <input type="text" class="t-input-text" value="${p.packName}" placeholder="例: ハンバーグ" 
                    oninput="t_onFieldInput(${group.outerId}, 'combPackName', ${item.groupId}, ${p.id}, this)"
                    onfocus="t_highlightPreviewCard(${p.id})">
                  ${canDeletePack ? `<button class="t-btn-danger" onclick="t_deleteCombPackStep1(${group.outerId}, ${item.groupId}, ${p.id})">✕ 削除</button>` : `<span style="font-size:10px; color:#888;">(最低2)</span>`}
                </div>
              `;
            });

            step1ItemsHtml += `
              <div class="t-comb-group-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <span style="font-size:12.5px; font-weight:bold; color:#3d2314;">🍳 組み合わせ料理名: 
                    <!-- ★修正: this.value を this に変更 -->
                    <input type="text" class="t-input-text" value="${item.groupName}" placeholder="例: ハンバーグデミグラスソース" style="width:240px; display:inline-block;" 
                      oninput="t_onFieldInput(${group.outerId}, 'groupName', ${item.groupId}, null, this)">
                  </span>
                  <div style="display:flex; gap:4px;">
                    <button class="t-btn-main" onclick="t_addPackToCombStep1(${group.outerId}, ${item.groupId})">＋ パック追加</button>
                    <button class="t-btn-danger" onclick="t_deleteTreeItemStep1(${group.outerId}, ${item.groupId})">グループ削除</button>
                  </div>
                </div>
                <div style="padding-left:15px; display:flex; flex-direction:column; gap:4px;">
                  ${packsListHtml}
                </div>
              </div>
            `;
          } else {
            step1ItemsHtml += `
              <div class="t-single-item-card">
                <div style="display:flex; align-items:center; gap:8px; flex:1;">
                  <span style="color:#555; font-weight:bold;">・</span>
                  <span style="font-size:11px; color:#555; width:55px;">単体料理:</span>
                  <!-- ★修正: this.value を this に変更 -->
                  <input type="text" class="t-input-text" value="${item.packName}" placeholder="例: 白ご飯" 
                    oninput="t_onFieldInput(${group.outerId}, 'singleName', ${item.id}, null, this)"
                    onfocus="t_highlightPreviewCard(${item.id})">
                </div>
                <button class="t-btn-danger" onclick="t_deleteTreeItemStep1(${group.outerId}, ${item.id})">削除</button>
              </div>
            `;
          }
        });
      }

      let step2DetailsHtml = '';
      if (group.items.length === 0) {
        step2DetailsHtml = `<div style="color:#888; font-size:12px; padding:10px; text-align:center;">構成が未設定のため詳細設定はありません</div>`;
      } else {
        group.items.forEach((item) => {
          if (item.type === 'combination') {
            let packsDetailHtml = '';
            item.packs.forEach((pack) => {
              const hMode = pack.heatMode || 'range';
              let heatSubInputHtml = '';
              if (hMode === 'range' || hMode === 'yusen') {
                heatSubInputHtml = `
                  <div class="t-time-wrap">
                    <span style="font-size:11px; font-weight:bold; color:#555;">⏱:</span>
                    <!-- ★修正: this.value を this に変更 -->
                    <input type="number" class="t-input-num" style="width:38px;" value="${pack.heatMin || ''}" placeholder="分" oninput="t_updatePackDetail(${group.outerId}, ${item.groupId}, ${pack.id}, 'heatMin', this)"> 分
                    <input type="number" class="t-input-num" style="width:38px;" value="${pack.heatSec || ''}" placeholder="秒" oninput="t_updatePackDetail(${group.outerId}, ${item.groupId}, ${pack.id}, 'heatSec', this)"> 秒
                  </div>
                `;
              } else if (hMode === 'custom') {
                heatSubInputHtml = `<input type="text" class="t-input-text" style="width:90px;" value="${pack.heatCustom || ''}" placeholder="自由入力" oninput="t_updatePackDetail(${group.outerId}, ${item.groupId}, ${pack.id}, 'heatCustom', this)">`;
              }

              packsDetailHtml += `
                <div class="t-tree-node-row" data-link-pack="${pack.id}" onclick="t_focusPreviewCard(${pack.id})">
                  <div class="t-input-group">
                    <span style="font-size:12px; font-weight:bold; color:#b71c1c; width:15px;">〇</span>
                    <label>パック</label>
                    <!-- ★修正: this.value を this に変更 -->
                    <input type="text" class="t-input-text" value="${pack.packName}" placeholder="例: ハンバーグ" oninput="t_updatePackDetail(${group.outerId}, ${item.groupId}, ${pack.id}, 'packName', this)" onfocus="t_highlightPreviewCard(${pack.id})">
                    
                    <label>温め</label>
                    <div style="display:flex; gap:2px; flex:1;">
                      <div class="t-btn-heat-choice range ${hMode==='range'?'active':''}" onclick="t_setPackHeatMode(${group.outerId}, ${item.groupId}, ${pack.id}, 'range')">レンジ</div>
                      <div class="t-btn-heat-choice yusen ${hMode==='yusen'?'active':''}" onclick="t_setPackHeatMode(${group.outerId}, ${item.groupId}, ${pack.id}, 'yusen')">湯煎</div>
                      <div class="t-btn-heat-choice cold ${hMode==='cold'?'active':''}" onclick="t_setPackHeatMode(${group.outerId}, ${item.groupId}, ${pack.id}, 'cold')">冷</div>
                      <div class="t-btn-heat-choice besshi ${hMode==='besshi'?'active':''}" onclick="t_setPackHeatMode(${group.outerId}, ${item.groupId}, ${pack.id}, 'besshi')">別紙</div>
                    </div>
                    ${heatSubInputHtml}

                    <label style="width:30px;">枚数</label>
                    <input type="number" class="t-input-num" value="${pack.copies}" min="1" oninput="t_updatePackDetail(${group.outerId}, ${item.groupId}, ${pack.id}, 'copies', this)">
                  </div>
                </div>
              `;
            });
            step2DetailsHtml += `
              <div style="background:#fffdf9; border:1px solid #d4a373; border-radius:6px; padding:8px; margin-bottom:8px;">
                <div style="font-size:12px; font-weight:bold; color:#3d2314; margin-bottom:6px;">🍳 組合せ: ${item.groupName}</div>
                ${packsDetailHtml}
              </div>
            `;
          } else {
            const hMode = item.heatMode || 'range';
            let heatSubInputHtml = '';
            if (hMode === 'range' || hMode === 'yusen') {
              heatSubInputHtml = `
                <div class="t-time-wrap">
                  <span style="font-size:11px; font-weight:bold; color:#555;">⏱:</span>
                  <!-- ★修正: this.value を this に変更 -->
                  <input type="number" class="t-input-num" style="width:38px;" value="${item.heatMin || ''}" placeholder="分" oninput="t_updateSingleItemDetail(${group.outerId}, ${item.id}, 'heatMin', this)"> 分
                  <input type="number" class="t-input-num" style="width:38px;" value="${item.heatSec || ''}" placeholder="秒" oninput="t_updateSingleItemDetail(${group.outerId}, ${item.id}, 'heatSec', this)"> 秒
                </div>
              `;
            } else if (hMode === 'custom') {
              heatSubInputHtml = `<input type="text" class="t-input-text" style="width:90px;" value="${item.heatCustom || ''}" placeholder="自由入力" oninput="t_updateSingleItemDetail(${group.outerId}, ${item.id}, 'heatCustom', this)">`;
            }

            step2DetailsHtml += `
              <div class="t-tree-node-row" data-link-pack="${item.id}" onclick="t_focusPreviewCard(${item.id})">
                <div class="t-input-group">
                  <span style="font-size:12px; font-weight:bold; color:#555; width:15px;">・</span>
                  <label>単体</label>
                  <!-- ★修正: this.value を this に変更 -->
                  <input type="text" class="t-input-text" value="${item.packName}" placeholder="例: 白ご飯" oninput="t_updateSingleItemDetail(${group.outerId}, ${item.id}, 'packName', this)" onfocus="t_highlightPreviewCard(${item.id})">
                  
                  <label>温め</label>
                  <div style="display:flex; gap:2px; flex:1;">
                    <div class="t-btn-heat-choice range ${hMode==='range'?'active':''}" onclick="t_setSingleHeatMode(${group.outerId}, ${item.id}, 'range')">レンジ</div>
                    <div class="t-btn-heat-choice yusen ${hMode==='yusen'?'active':''}" onclick="t_setSingleHeatMode(${group.outerId}, ${item.id}, 'yusen')">湯煎</div>
                    <div class="t-btn-heat-choice cold ${hMode==='cold'?'active':''}" onclick="t_setSingleHeatMode(${group.outerId}, ${item.id}, 'cold')">冷</div>
                    <div class="t-btn-heat-choice besshi ${hMode==='besshi'?'active':''}" onclick="t_setSingleHeatMode(${group.outerId}, ${item.id}, 'besshi')">別紙</div>
                  </div>
                  ${heatSubInputHtml}

                  <label style="width:30px;">枚数</label>
                  <input type="number" class="t-input-num" value="${item.copies}" min="1" oninput="t_updateSingleItemDetail(${group.outerId}, ${item.id}, 'copies', this)">
                </div>
              </div>
            `;
          }
        });
      }

      htmlLeft += `
        <div class="t-tree-set-box" id="t-set-group-${group.outerId}">
          <div class="t-tree-set-header">
            <div class="t-input-group">
              <strong style="color:#3d2314; font-size:13px; white-space:nowrap;">📦 外袋ラベル（親）:</strong>
              <!-- ★修正: this.value を this に変更 -->
              <input type="text" class="t-input-text" value="${group.outerName}" placeholder="例: 魚アレルギー対応 朝食" oninput="t_updateOuter(${group.outerId}, 'outerName', this)">
              
              <div class="t-outer-option-wrap">
                <span style="font-size:11px; color:#555; font-weight:bold;">右上の表示:</span>
                <div style="display:flex; gap:4px;">
                  <div class="t-btn-outer-choice ${outerOpt==='1'?'active':''}" onclick="t_setOuterOption(${group.outerId}, '1')">冷凍・前日</div>
                  <div class="t-btn-outer-choice ${outerOpt==='2'?'active':''}" onclick="t_setOuterOption(${group.outerId}, '2')">冷蔵保管</div>
                  <div class="t-btn-outer-choice ${outerOpt==='3'?'active':''}" onclick="t_setOuterOption(${group.outerId}, '3')">冷凍保管</div>
                  <div class="t-btn-outer-choice ${outerOpt==='4'?'active':''}" onclick="t_setOuterOption(${group.outerId}, '4')">無し</div>
                </div>
              </div>

              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:11px; color:#555; font-weight:bold;">枚数:</span>
                <!-- ★修正: this.value を this に変更 -->
                <input type="number" class="t-input-num" value="${group.setCopies}" min="1" oninput="t_updateOuter(${group.outerId}, 'setCopies', this)">
                <button class="t-btn-danger" onclick="t_deleteSet(${group.outerId})">外袋削除</button>
              </div>
            </div>
          </div>

          <div class="t-step-section-1">
            <div class="t-step-banner s1">ステップ1：ツリー構成（骨組み）の作成</div>
            <div style="margin-bottom:8px; display:flex; gap:6px;">
              <button class="t-btn-main" onclick="t_addCombinationGroupStep1(${group.outerId})">＋ 組み合わせ料理を追加</button>
              <button class="t-btn-secondary" onclick="t_addSinglePackStep1(${group.outerId})">＋ 単体料理を追加</button>
            </div>
            <div>${step1ItemsHtml}</div>
          </div>

          <div class="t-step-section-2">
            <div class="t-step-banner s2">ステップ2：詳細属性の設定（温め方・枚数）</div>
            <div>${step2DetailsHtml}</div>
          </div>
        </div>
      `;
    });

    htmlLeft += `
      <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #dcd6ce; flex-shrink: 0;">
        <button class="t-btn-main" style="width: 100%; background: #e65100; border: 1px solid #ef6c00;" onclick="t_addSetGroup()">＋ 外袋セットを追加する</button>
      </div>
    `;
    inputPanel.innerHTML = htmlLeft;

    t_updatePreviewOnly();
  }

  function t_computeHeatingText(pack) {
    const m = pack.heatMode || 'range';
    if (m === 'range') {
      let t = 'レンジ 600Wで';
      if (pack.heatMin) t += `${pack.heatMin}分`;
      if (pack.heatSec) t += `${pack.heatSec}秒`;
      return t + '温め';
    } else if (m === 'yusen') {
      let t = '湯煎で';
      if (pack.heatMin) t += `${pack.heatMin}分`;
      if (pack.heatSec) t += `${pack.heatSec}秒`;
      return t + '温め';
    } else if (m === 'cold') return '冷たいまま';
    else if (m === 'besshi') return '調理方法は別紙資料参照';
    else if (m === 'custom') return pack.heatCustom || '';
    return '';
  }

  function t_updatePreviewOnly() {
    const previewPanel = document.getElementById('t-treePreviewPanel');
    let previewHTML = `<div class="t-panel-header-row"><div class="t-panel-title">ツリー連動印刷プレビュー</div></div>`;

    if (t_treeData.length === 0) {
      previewPanel.innerHTML = previewHTML + `<div style="text-align:center; padding:40px; color:#777;">プレビューはありません</div>`;
      return;
    }

    t_treeData.forEach((group) => {
      const outerOpt = group.outerOption || "1";
      let outerSubTextHtml = "";
      let outerHeaderStyle = "";
      if (outerOpt === "1") outerSubTextHtml = '<span class="t-p-outer-cat">冷凍庫保管・前日冷蔵庫解凍</span>';
      else if (outerOpt === "2") outerSubTextHtml = '<span class="t-p-outer-cat">冷蔵庫保管</span>';
      else if (outerOpt === "3") outerSubTextHtml = '<span class="t-p-outer-cat">冷凍庫保管</span>';
      else if (outerOpt === "4") outerHeaderStyle = 'justify-content: center;';

      const outerNameLines = (group.outerName || '').split(/\r\n|\r|\n/);
      let outerNameHtml = '';
      outerNameLines.forEach(line => {
        if (line.trim() !== '') outerNameHtml += `<div class="t-p-line-wrapper"><span class="t-p-item-name">${line}</span></div>`;
      });

      let childCardsHtml = '';
      group.items.forEach(item => {
        let listToRender = item.type === 'combination' ? item.packs : [item];
        listToRender.forEach(pack => {
          const itemNameHtml = `<div class="t-p-line-wrapper"><span class="t-p-item-name">${pack.packName || ''}</span></div>`;
          
          let cookingHtml = '';
          let cardStyleClass = 'single-card';
          if (item.type === 'combination') {
            cardStyleClass = 'comb-card';
            cookingHtml = `
              <div class="t-p-line-wrapper">
                <div class="t-p-item-sub">
                  <span class="weight-light">[</span> 
                  <span class="weight-bold">${item.groupName}</span> 
                  <span class="weight-light">]</span>
                </div>
              </div>
            `;
          }

          const heatingText = t_computeHeatingText(pack);
          const hMode = pack.heatMode || 'range';
          let heatingColor = '#2e7d32'; 
          if (hMode === 'range' || hMode === 'yusen') heatingColor = '#b71c1c'; 
          if (hMode === 'cold') heatingColor = '#0288d1';   

          // ★修正2: ピタゴラスイッチ防止のためプレビューからのonclick属性を完全削除
          childCardsHtml += `
            <div class="t-preview-child-row">
              <div class="t-label-preview-card ${cardStyleClass}" data-preview-pack="${pack.id}">
                <div class="t-p-header" style="${outerHeaderStyle}">
                  ${t_svgLogoString}
                  <div class="t-p-cat-wrapper"><span class="t-p-set-cat">${group.outerName || ''}</span></div>
                </div>
                <div class="t-p-body-center">
                  ${itemNameHtml}
                  ${cookingHtml}
                </div>
                <div class="t-p-footer">
                  <div class="t-p-green-line" style="background-color: ${heatingColor};"></div>
                  <div class="t-p-footer-instruction" style="color: ${heatingColor};">${heatingText}</div>
                </div>
              </div>
              <div class="t-preview-copies-badge">× ${pack.copies || 1} 枚</div>
            </div>
          `;
        });
      });

      previewHTML += `
        <div class="t-preview-tree-group">
          <div class="t-preview-parent-row">
            <div class="t-label-preview-card outer-bag">
              <div class="t-p-header" style="${outerHeaderStyle}">
                ${t_svgLogoString}
                <!-- ★修正: ネストされたバッククォートを排除し構文エラーを解消 -->
                ${outerOpt !== "4" ? '<div class="t-p-cat-wrapper">' + outerSubTextHtml + '</div>' : ''}
              </div>
              <div class="t-p-body-center">${outerNameHtml}</div>
            </div>
            <div class="t-preview-copies-badge">× ${Number(group.setCopies || 1)} 枚</div>
          </div>
          <div class="t-preview-children-box">${childCardsHtml}</div>
        </div>
      `;
    });

    previewPanel.innerHTML = previewHTML;
    t_bindHoverSync();
    t_applyAutoFit();
  }

  // --- 操作用関数群 ---
  function t_addSetGroup() {
    t_treeData.push({ outerId: Date.now(), outerName: '', outerOption: '1', setCopies: 1, items: [] });
    t_render();
  }
  function t_deleteSet(outerId) {
    if (confirm("外袋セットを削除しますか？")) {
      t_treeData = t_treeData.filter(x => x.outerId !== outerId);
      t_render();
    }
  }

  function t_addCombinationGroupStep1(outerId) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      const id = Date.now();
      g.items.push({
        type: 'combination', groupId: id, groupName: '',
        packs: [
          { id: id + 1, packName: '', heatMode: 'range', heatMin: '2', heatSec: '', copies: g.setCopies },
          { id: id + 2, packName: '', heatMode: 'range', heatMin: '2', heatSec: '', copies: g.setCopies }
        ]
      });
      t_render();
    }
  }

  function t_addSinglePackStep1(outerId) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      g.items.push({ type: 'single', id: Date.now(), packName: '', heatMode: 'range', heatMin: '2', heatSec: '', copies: g.setCopies });
      t_render();
    }
  }

  function t_addPackToCombStep1(outerId, groupId) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      const item = g.items.find(i => i.type === 'combination' && i.groupId === groupId);
      if (item) { item.packs.push({ id: Date.now(), packName: '', heatMode: 'range', heatMin: '2', heatSec: '', copies: g.setCopies }); t_render(); }
    }
  }

  function t_deleteCombPackStep1(outerId, groupId, packId) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      const item = g.items.find(i => i.type === 'combination' && i.groupId === groupId);
      if (item) {
        if (item.packs.length <= 2) { alert('最低2パック必要です。'); return; }
        item.packs = item.packs.filter(p => p.id !== packId); t_render();
      }
    }
  }

  function t_deleteTreeItemStep1(outerId, id) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) { g.items = g.items.filter(i => (i.type === 'combination' ? i.groupId !== id : i.id !== id)); t_render(); }
  }

  // 共通のサニタイズ関数
  function t_sanitizeInput(text) {
    if (!text) return '';
    return String(text).replace(/ /g, ' ').replace(/ +/g, ' ').trimStart(); // trimStartで先頭の空白のみ削除（入力中の末尾スペース許容のため）
  }

  // ★引数に `el` (入力要素そのもの) を追加
  function t_onFieldInput(outerId, type, id1, id2, el) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (!g) return;
    
    // 入力値を取得しサニタイズ
    const originalVal = el.value;
    const cleanVal = t_sanitizeInput(originalVal);

    // ★重要: もし全角スペース等が含まれていてサニタイズ結果が変わった場合、入力欄の見た目も即座に上書きする
    if (originalVal !== cleanVal) {
      el.value = cleanVal;
    }

    if (type === 'groupName') {
      const item = g.items.find(i => i.type === 'combination' && i.groupId === id1);
      if (item) item.groupName = cleanVal;
    } else if (type === 'combPackName') {
      const item = g.items.find(i => i.type === 'combination' && i.groupId === id1);
      if (item) { const p = item.packs.find(x => x.id === id2); if (p) p.packName = cleanVal; }
    } else if (type === 'singleName') {
      const item = g.items.find(i => i.type === 'single' && i.id === id1);
      if (item) item.packName = cleanVal;
    }
    t_updatePreviewOnly();
  }

  // ★引数に `el` を追加
  function t_updateOuter(outerId, field, el) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      const originalVal = el.value;
      if (field === 'setCopies') {
        g[field] = originalVal;
      } else {
        const cleanVal = t_sanitizeInput(originalVal);
        if (originalVal !== cleanVal) el.value = cleanVal; // 入力欄を上書き
        g[field] = cleanVal;
      }
      t_updatePreviewOnly();
    }
  }

  function t_setOuterOption(outerId, val) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) { g.outerOption = val; t_render(); }
  }
  
  // ★引数に `el` を追加
  function t_updatePackDetail(outerId, groupId, packId, field, el) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      const item = g.items.find(i => i.type === 'combination' && i.groupId === groupId);
      if (item) {
        const p = item.packs.find(x => x.id === packId);
        if (p) {
          const originalVal = el.value;
          if (field === 'packName' || field === 'heatCustom') {
            const cleanVal = t_sanitizeInput(originalVal);
            if (originalVal !== cleanVal) el.value = cleanVal; // 入力欄を上書き
            p[field] = cleanVal;
          } else {
            p[field] = originalVal;
          }
          t_updatePreviewOnly();
        }
      }
    }
  }

  // ★引数に `el` を追加
  function t_updateSingleItemDetail(outerId, itemId, field, el) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      const item = g.items.find(i => i.type === 'single' && i.id === itemId);
      if (item) {
        const originalVal = el.value;
        if (field === 'packName' || field === 'heatCustom') {
          const cleanVal = t_sanitizeInput(originalVal);
          if (originalVal !== cleanVal) el.value = cleanVal; // 入力欄を上書き
          item[field] = cleanVal;
        } else {
          item[field] = originalVal;
        }
        t_updatePreviewOnly();
      }
    }
  }

  function t_setPackHeatMode(outerId, groupId, packId, mode) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) {
      const item = g.items.find(i => i.type === 'combination' && i.groupId === groupId);
      if (item) { const p = item.packs.find(x => x.id === packId); if (p) { p.heatMode = mode; t_render(); } }
    }
  }
  function t_setSingleHeatMode(outerId, itemId, mode) {
    const g = t_treeData.find(x => x.outerId === outerId);
    if (g) { const item = g.items.find(i => i.type === 'single' && i.id === itemId); if (item) { item.heatMode = mode; t_render(); } }
  }

  // 自動長体処理
  function t_applyAutoFit() {
    document.querySelectorAll('.t-label-preview-card').forEach(card => {
      const header = card.querySelector('.t-p-header');
      if (!header) return;
      const logoSvg = header.querySelector('.t-p-logo-svg');
      const logoWidth = logoSvg ? logoSvg.getBoundingClientRect().width : 35;
      const headerWidth = header.clientWidth - logoWidth - 12; 
      
      // ★修正3: 長体処理の起点を右寄せに指定
      const setCatSpan = card.querySelector('.t-p-set-cat');
      if (setCatSpan) {
        setCatSpan.style.transform = 'none';
        if (setCatSpan.scrollWidth > headerWidth && headerWidth > 0) {
          const scale = headerWidth / setCatSpan.scrollWidth;
          setCatSpan.style.transformOrigin = 'right center';
          setCatSpan.style.transform = `scaleX(${Math.max(0.3, scale).toFixed(3)})`;
        }
      }
      const outerCatSpan = card.querySelector('.t-p-outer-cat');
      if (outerCatSpan) {
        outerCatSpan.style.transform = 'none';
        if (outerCatSpan.scrollWidth > headerWidth && headerWidth > 0) {
          const scale = headerWidth / outerCatSpan.scrollWidth;
          outerCatSpan.style.transformOrigin = 'right center';
          outerCatSpan.style.transform = `scaleX(${Math.max(0.3, scale).toFixed(3)})`;
        }
      }

      const bodyCenter = card.querySelector('.t-p-body-center');
      if (bodyCenter) {
        const bodyWidth = bodyCenter.clientWidth - 12;
        card.querySelectorAll('.t-p-item-name, .t-p-item-sub .weight-bold').forEach(el => {
          const targetEl = el.classList.contains('weight-bold') ? el.parentElement : el;
          targetEl.style.transform = 'none';
          if (targetEl.scrollWidth > bodyWidth && bodyWidth > 0) {
            const scale = bodyWidth / targetEl.scrollWidth;
            targetEl.style.transform = `scaleX(${Math.max(0.3, scale).toFixed(3)})`;
            targetEl.style.display = 'inline-block';
          }
        });
      }
    });
  }

  // ホバー同期・スクロール追従
  function t_bindHoverSync() {
    document.querySelectorAll('.t-tree-node-row').forEach(row => {
      const packId = row.dataset.linkPack;
      const previewCard = document.querySelector(`[data-preview-pack="${packId}"]`);
      if (!previewCard) return;
      row.addEventListener('mouseenter', () => { row.classList.add('active-hover'); previewCard.classList.add('highlighted'); });
      row.addEventListener('mouseleave', () => { row.classList.remove('active-hover'); previewCard.classList.remove('highlighted'); });
      previewCard.addEventListener('mouseenter', () => { previewCard.classList.add('highlighted'); row.classList.add('active-hover'); });
      previewCard.addEventListener('mouseleave', () => { previewCard.classList.remove('highlighted'); row.classList.remove('active-hover'); });
    });
  }

  function t_highlightPreviewCard(packId) {
    const previewCard = document.querySelector(`[data-preview-pack="${packId}"]`);
    if (previewCard) {
      setTimeout(() => {
        previewCard.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        previewCard.classList.add('highlighted');
        setTimeout(() => { previewCard.classList.remove('highlighted'); }, 1200);
      }, 100);
    }
  }

  function t_focusPreviewCard(packId) {
    const previewCard = document.querySelector(`[data-preview-pack="${packId}"]`);
    if (previewCard) {
      previewCard.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
      previewCard.classList.add('highlighted');
      setTimeout(() => { previewCard.classList.remove('highlighted'); }, 1200);
    }
  }
</script>
